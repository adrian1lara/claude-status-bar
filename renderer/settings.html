<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Settings</title>
  <style>
    :root {
      --bg: #1c1c1e; --panel: #2a2a2d; --text: #f5f5f7;
      --muted: #9a9aa2; --accent: #cc785c; --border: #3a3a3d;
      --green: #3fb950; --red: #f85149;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 13px; }
    .container { padding: 20px 24px; }
    h1 { font-size: 16px; margin: 0 0 4px 0; font-weight: 600; }
    .subtitle { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 14px 16px; margin-bottom: 16px; }
    .auth-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .auth-status { font-size: 13px; }
    .auth-status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 6px; vertical-align: middle; background: var(--red); }
    .auth-status.connected .dot { background: var(--green); }
    .auth-hint { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px;
      text-transform: uppercase; letter-spacing: 0.4px; }
    input[type="number"] {
      width: 120px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 10px; color: var(--text); font-size: 13px; font-family: inherit;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .toggle { display: flex; align-items: center; gap: 8px; }
    .toggle input { width: auto; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    button { background: var(--panel); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; font-family: inherit; }
    button:hover { background: #34343a; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: #b86a4f; }
    button.danger { color: var(--red); }
    .saved { color: var(--green); font-size: 12px; align-self: center; margin-right: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Claude Usage Bar — Settings</h1>
    <div class="subtitle">
      Reads your real Claude.ai usage by signing in to your account.
    </div>

    <div class="card">
      <div class="auth-row">
        <div class="auth-status" id="authStatus">
          <span class="dot"></span><span id="authText">Not connected</span>
        </div>
        <div>
          <button class="primary" id="connectBtn">Sign in to claude.ai</button>
          <button class="danger" id="logoutBtn" style="display:none">Sign out</button>
        </div>
      </div>
      <div class="auth-hint">
        Opens a window where you log in to claude.ai normally (email link, Google, etc.).
        We capture the session cookie locally and use it to read your usage page.
      </div>
    </div>

    <div class="field">
      <label for="interval">Poll interval (seconds)</label>
      <input type="number" id="interval" min="30" />
    </div>

    <div class="field toggle">
      <input type="checkbox" id="launch" />
      <label for="launch" style="margin:0; text-transform: none; letter-spacing: 0;">Launch at login</label>
    </div>

    <div class="actions">
      <span class="saved" id="saved" style="display:none">Saved ✓</span>
      <button id="cancelBtn">Close</button>
      <button class="primary" id="saveBtn">Save</button>
    </div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
