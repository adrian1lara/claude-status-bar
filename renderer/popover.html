<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Claude Usage</title>
  <style>
    :root {
      --bg: #1c1c1e; --panel: #2a2a2d; --text: #f5f5f7;
      --muted: #9a9aa2; --accent: #cc785c;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 13px; -webkit-user-select: none; user-select: none; overflow: hidden;
    }
    .container { padding: 14px 16px; }
    .header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .title { font-weight: 600; font-size: 12px; color: var(--muted); letter-spacing: 0.4px; text-transform: uppercase; }
    .plan { font-size: 11px; color: var(--muted); }
    .section { margin-top: 12px; }
    .section-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
    .row { display: flex; justify-content: space-between; align-items: baseline; }
    .pct { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
    .meta { font-size: 12px; color: var(--muted); }
    .bar { width: 100%; height: 6px; background: #3a3a3d; border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .bar-fill { height: 100%; width: 0%; transition: width 250ms ease, background-color 250ms ease; background: #3fb950; }
    .footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 14px; }
    button { background: var(--panel); color: var(--text); border: 1px solid #3a3a3d; border-radius: 6px;
      padding: 6px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
    button:hover { background: #34343a; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: #b86a4f; }
    .updated { font-size: 11px; color: var(--muted); }
    .empty { color: var(--muted); font-size: 12px; padding: 20px 0; text-align: center; }
    .empty button { margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">Claude Usage</div>
      <div class="plan" id="plan"></div>
    </div>

    <div id="empty" class="empty" style="display:none">
      <div id="emptyMsg">Not signed in to claude.ai</div>
      <button class="primary" id="signInBtn">Sign in</button>
    </div>

    <div id="data">
      <div class="section">
        <div class="section-label">Current session</div>
        <div class="row">
          <div class="pct" id="sessionPct">—</div>
          <div class="meta" id="sessionReset">—</div>
        </div>
        <div class="bar"><div class="bar-fill" id="sessionBar"></div></div>
      </div>

      <div class="section">
        <div class="section-label">Weekly · all models</div>
        <div class="row">
          <div class="pct" id="weeklyPct">—</div>
          <div class="meta" id="weeklyReset">—</div>
        </div>
        <div class="bar"><div class="bar-fill" id="weeklyBar"></div></div>
      </div>
    </div>

    <div class="footer">
      <span class="updated" id="updated">—</span>
      <div>
        <button id="settingsBtn">Settings</button>
        <button class="primary" id="refreshBtn">Refresh</button>
      </div>
    </div>
  </div>
  <script src="popover.js"></script>
</body>
</html>
